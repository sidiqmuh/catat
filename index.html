<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CATAT</title>
<meta name="description" content="CATAT — pencatat pengeluaran dan pemasukan harian">
<meta name="theme-color" content="#FBF8F4" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CATAT">
<meta name="application-name" content="CATAT">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: "Linimasa" — a warm journal. Header (logo, Harian/Laporan switch, menu), a 7‑day strip, today's total, and a vertical timeline of entries. A fixed "Catat cepat" bar sits at the bottom; "+" opens the Dompetku-style sheet (type tabs, big amount, account/date line, icon category grid, number pad, Simpan). Phone-width column, max 560px. */
:root{
  --bg:#FBF8F4; --surface:#FFFFFF; --surface-2:#F4EEE7; --line:#EFE7DF; --ink:#1F1A17; --ink-2:#5A5049; --ink-3:#857A72;
  --accent:#E8590C; --accent-ink:#FFFFFF; --accent-soft:#FFEDD5; --dark:#1F1A17; --dark-ink:#FFFFFF;
  --out:#C2410C; --in:#15803D; --in-soft:#DCFCE7; --xfer:#2563EB; --xfer-soft:#DBEAFE; --warn:#A16207; --warn-soft:#FEF3C7;
  --scrim:rgba(31,26,23,.45); --glass:rgba(251,248,244,.94); --shadow:0 4px 16px rgba(31,26,23,.06); --shadow-lg:0 -12px 40px rgba(31,26,23,.2);
  --mixbg:14%; --body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not(.t-light){
  --bg:#15110E; --surface:#1F1915; --surface-2:#2A221D; --line:#302721; --ink:#F4EDE6; --ink-2:#C9BCB0; --ink-3:#9A8C80;
  --accent:#FF8A3D; --accent-ink:#2A1203; --accent-soft:#3A2414; --dark:#F4EDE6; --dark-ink:#1F1A17;
  --out:#FF9B6B; --in:#6EE7A0; --in-soft:#173A26; --xfer:#8AB4FF; --xfer-soft:#1B2A45; --warn:#F5C451; --warn-soft:#3A2E12;
  --scrim:rgba(0,0,0,.6); --glass:rgba(21,17,14,.94); --shadow:0 4px 16px rgba(0,0,0,.3); --shadow-lg:0 -12px 40px rgba(0,0,0,.55); --mixbg:24%; color-scheme:dark}}
:root[data-theme="dark"]:not(.t-light),:root.t-dark{
  --bg:#15110E; --surface:#1F1915; --surface-2:#2A221D; --line:#302721; --ink:#F4EDE6; --ink-2:#C9BCB0; --ink-3:#9A8C80;
  --accent:#FF8A3D; --accent-ink:#2A1203; --accent-soft:#3A2414; --dark:#F4EDE6; --dark-ink:#1F1A17;
  --out:#FF9B6B; --in:#6EE7A0; --in-soft:#173A26; --xfer:#8AB4FF; --xfer-soft:#1B2A45; --warn:#F5C451; --warn-soft:#3A2E12;
  --scrim:rgba(0,0,0,.6); --glass:rgba(21,17,14,.94); --shadow:0 4px 16px rgba(0,0,0,.3); --shadow-lg:0 -12px 40px rgba(0,0,0,.55); --mixbg:24%; color-scheme:dark}
:root.t-light{
  --bg:#FBF8F4; --surface:#FFFFFF; --surface-2:#F4EEE7; --line:#EFE7DF; --ink:#1F1A17; --ink-2:#5A5049; --ink-3:#857A72;
  --accent:#E8590C; --accent-ink:#FFFFFF; --accent-soft:#FFEDD5; --dark:#1F1A17; --dark-ink:#FFFFFF;
  --out:#C2410C; --in:#15803D; --in-soft:#DCFCE7; --xfer:#2563EB; --xfer-soft:#DBEAFE; --warn:#A16207; --warn-soft:#FEF3C7;
  --scrim:rgba(31,26,23,.45); --glass:rgba(251,248,244,.94); --shadow:0 4px 16px rgba(31,26,23,.06); --shadow-lg:0 -12px 40px rgba(31,26,23,.2); --mixbg:14%; color-scheme:light}

html{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;
  padding-inline:18px;padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;user-select:none;-webkit-user-select:none}
input,select,textarea{font-size:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3);font-size:13px}
.lbl{font-size:12px;color:var(--ink-3);font-weight:600}
.wrap{max-width:560px;margin:0 auto;min-width:0;display:flex;flex-direction:column}
svg.i{flex:none}

/* header */
.head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{border-radius:11px;flex:none}
.brand .t{display:flex;flex-direction:column;min-width:0}
.brand .t span{font-size:12.5px;color:var(--ink-3);font-weight:600;white-space:nowrap}
.brand .t b{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.hr{display:flex;gap:8px;align-items:center}
.ib{position:relative;width:42px;height:42px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2);flex:none}
.ib svg{width:20px;height:20px}
.dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.dot.ok{background:var(--in)} .dot.err{background:var(--out)} .dot.busy{background:var(--warn);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:14px;padding:4px;margin-top:14px}
.tabs button{flex:1;height:36px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--ink-3)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* week strip */
.wk-head{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.wk-head b{font-size:15px}
.wk-nav{display:flex;gap:6px}
.wk-nav button{width:32px;height:32px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
.wk-nav button svg{width:16px;height:16px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.day{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0 9px;border-radius:16px;min-width:0}
.day span{font-size:11px;font-weight:600;color:var(--ink-3)}
.day b{font-size:16px;font-weight:800}
.day i{width:6px;border-radius:4px;background:color-mix(in srgb,var(--accent) 30%,var(--surface-2));min-height:5px}
.day.today b{color:var(--accent)}
.day[aria-pressed="true"]{background:var(--dark);color:var(--dark-ink)}
.day[aria-pressed="true"] span{color:inherit;opacity:.7}
.day[aria-pressed="true"] b{color:inherit}
.day[aria-pressed="true"] i{background:var(--accent)}
.day.future{opacity:.4}

/* day summary */
.sum{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:18px;flex-wrap:wrap}
.sum .big{font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
.badge{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.badge.up{background:var(--accent-soft);color:var(--out)} .badge.down{background:var(--in-soft);color:var(--in)} .badge.n{background:var(--surface-2);color:var(--ink-3)}
.subline{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.subline span{font-size:12.5px;font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.subline .good{color:var(--in)} .subline .bad{color:var(--out)}

/* timeline */
.tl{position:relative;margin-top:16px;display:flex;flex-direction:column;gap:2px}
.tl::before{content:"";position:absolute;left:19px;top:14px;bottom:14px;width:2px;background:var(--line)}
.it{display:flex;gap:12px;align-items:center;padding:6px 0;position:relative;text-align:left;width:100%}
.it .ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;border:4px solid var(--bg);flex:none;position:relative;z-index:1}
.it .ic svg{width:17px;height:17px}
.it .cd{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:transform .08s}
.it:active .cd{transform:scale(.98)}
.it .t1{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .t2{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .v{font-size:14px;font-weight:800;white-space:nowrap}
.v.in{color:var(--in)} .v.x{color:var(--xfer)} .v.up{color:var(--warn)}
.empty{padding:28px 10px;text-align:center;color:var(--ink-3);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.qbox{flex:1;min-width:0;height:56px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:4px;padding:0 6px 0 4px;box-shadow:var(--shadow)}
.qbox .plus{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;color:var(--accent);flex:none}
.qbox .plus svg{width:24px;height:24px}
.qbox input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%}
.qbox input::placeholder{color:var(--ink-3)}
.qbox .go{height:40px;padding:0 14px;border-radius:13px;background:var(--dark);color:var(--dark-ink);font-size:13.5px;font-weight:700;flex:none}
.cam{width:56px;height:56px;border-radius:20px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;box-shadow:var(--shadow)}
.cam svg{width:24px;height:24px}
.qprev{position:absolute;left:18px;right:18px;bottom:100%;display:flex;justify-content:center}
.qprev div{max-width:560px;width:100%;display:flex;flex-wrap:wrap;gap:6px;padding-bottom:8px}
.qp{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.qp.miss{border-style:dashed;color:var(--warn)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.sheet.on{transform:none;pointer-events:auto}
.sheet-in{max-width:560px;margin:0 auto;background:var(--surface);border-radius:28px 28px 0 0;box-shadow:var(--shadow-lg);padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:94vh;max-height:94dvh;overflow-y:auto;overscroll-behavior:contain}
.grab{align-self:center;width:44px;height:5px;border-radius:3px;background:var(--line);flex:none;margin:4px 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:var(--surface-2);border-radius:14px;padding:4px}
.seg button{height:38px;border-radius:11px;font-size:14px;font-weight:700;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--dark);color:var(--dark-ink)}
.seg.type button[aria-pressed="true"][data-t="Pengeluaran"]{background:var(--out);color:#fff}
.seg.type button[aria-pressed="true"][data-t="Pemasukan"]{background:var(--in);color:#fff}
.seg.type button[aria-pressed="true"][data-t="Pindah Saldo"]{background:var(--xfer);color:#fff}
.amt{text-align:center}
.amt .n{font-size:clamp(38px,11vw,46px);font-weight:800;letter-spacing:-.03em;line-height:1.1;white-space:nowrap}
.amt .n small{font-size:.5em;color:var(--ink-3);margin-right:3px}
.amt .n.zero{color:var(--ink-3)}
.meta{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.mb{font-size:13px;color:var(--ink-3);font-weight:600;padding:5px 10px;border-radius:999px;background:var(--surface-2)}
.mb b{color:var(--ink)}
.mb[aria-expanded="true"]{box-shadow:inset 0 0 0 2px var(--accent)}
.picker{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.pk{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.pk[aria-pressed="true"]{background:var(--dark);color:var(--dark-ink)}
.pk input[type=date]{border:0;background:none;padding:0;font-size:13px;outline:none;color:inherit;width:120px}
.cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 6px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.2;min-width:0}
.cat .b{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;transition:transform .08s}
.cat .b svg{width:24px;height:24px}
.cat:active .b{transform:scale(.93)}
.cat[aria-pressed="true"]{font-weight:800;color:var(--ink)}
.cat[aria-pressed="true"] .b{box-shadow:0 0 0 2.5px currentColor}
.cat span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow{display:flex;flex-direction:column;gap:8px}
.flow .r{display:flex;gap:8px;align-items:center}
.flow .r>span{width:34px;font-size:12.5px;color:var(--ink-3);font-weight:600;flex:none}
.flow .opts{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.key{height:50px;border-radius:14px;background:var(--surface-2);font-size:21px;font-weight:600;color:var(--ink);display:grid;place-items:center;transition:transform .06s}
.key:active{transform:scale(.94)}
.key svg{width:22px;height:22px}
.save{height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:16px;font-weight:800;width:100%}
.save.in{background:var(--in);color:#fff} .save.x{background:var(--xfer);color:#fff}
.mini{width:100%;border:0;background:var(--surface-2);border-radius:12px;padding:11px 12px;outline:none;min-width:0}
.mini:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.err{color:var(--out);font-size:13px;font-weight:600;text-align:center}
.hint{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px}

/* report */
.rp-head{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.rp-head b{font-size:22px;letter-spacing:-.02em}
.dark-card{background:var(--dark);color:var(--dark-ink);border-radius:24px;padding:18px;margin-top:14px}
.dark-card .r3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.dark-card .r3 span{font-size:12px;opacity:.6}
.dark-card .r3 b{display:block;font-size:clamp(15px,4.6vw,19px);font-weight:800;overflow-wrap:anywhere}
.chart{display:flex;align-items:flex-end;gap:3px;height:90px;margin-top:16px}
.chart i{flex:1;border-radius:3px;background:color-mix(in srgb,currentColor 25%,transparent);min-height:3px}
.chart i.on{background:var(--accent)}
.axis{display:flex;justify-content:space-between;font-size:10.5px;opacity:.5;margin-top:6px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-top:10px}
.cc .r{display:flex;align-items:center;gap:10px}
.cc .r .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.cc .r .ic svg{width:15px;height:15px}
.cc .r span{flex:1;font-size:13.5px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc .r b{font-size:13.5px;white-space:nowrap}
.cc .tr{height:6px;border-radius:6px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.cc .tr i{display:block;height:100%;border-radius:6px}
.cc .d{font-size:11.5px;color:var(--ink-3);margin-top:6px}

/* menu & forms */
.card{background:var(--surface-2);border-radius:18px;padding:14px;min-width:0}
.card h3{font-size:16px;margin:0 0 10px;font-weight:800}
.field{border:0;background:var(--surface);border-radius:12px;padding:11px 12px;outline:none;width:100%;min-width:0}
.field:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.inl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inl .field{flex:1;min-width:120px;width:auto}
.btn{height:40px;padding:0 16px;border-radius:12px;background:var(--dark);color:var(--dark-ink);font-weight:700;font-size:14px;white-space:nowrap}
.btn.acc{background:var(--accent);color:var(--accent-ink)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.gh{background:var(--surface);color:var(--ink-2)}
.btn.danger{background:var(--accent-soft);color:var(--out)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t1{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t2{font-size:12px;color:var(--ink-3)}
.chk{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink-2);background:var(--surface);border-radius:12px;padding:10px 12px}
.chk input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.neg{color:var(--out)}
.help p{margin:0 0 6px;font-size:13.5px;color:var(--ink-2)}
.help code{font-family:var(--body);font-weight:700;color:var(--ink);background:var(--surface);padding:1px 6px;border-radius:6px}
[aria-busy="true"]{opacity:.55;pointer-events:none}
.banner{border-radius:14px;padding:12px 14px;font-size:13.5px;background:var(--warn-soft);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.banner button{font-weight:700;color:var(--accent)}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px;height:14px}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--dark);color:var(--dark-ink);border-radius:14px;padding:10px 10px 10px 16px;font-size:13.5px;font-weight:600;transition:transform .25s,opacity .25s;width:max-content;max-width:calc(100% - 32px);z-index:40;display:flex;gap:12px;align-items:center}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{font-weight:800;color:var(--accent);padding:6px 10px;border-radius:9px;background:color-mix(in srgb,var(--accent) 22%,transparent);white-space:nowrap}
.fade{animation:fade .22s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* app feel */
html,body{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
body{overscroll-behavior-y:none}
.setup{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.setup-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}

<script>
(function(){
document.addEventListener("contextmenu",e=>{if(!e.target.closest("input,textarea"))e.preventDefault()});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
["gesturestart","gesturechange","gestureend"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches&&e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault()},{passive:false});

const SID="1qMUug57zHW5dur1fQlxHpUKZfyR88ChPJ3kjn5V861k",SRV="Google Sheets",XF="Pindah Saldo",UP="Utang Piutang";
const UP_IN=["Pinjam uang","Terima pelunasan"],UP_OUT=["Meminjamkan","Bayar utang"],UP_PAY=["Terima pelunasan","Bayar utang"];
const BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"],HR=["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
const $=id=>document.getElementById(id);
const fmt=n=>"Rp"+Math.round(n).toLocaleString("id-ID");
const fmtS=n=>(n<0?"−":"")+fmt(Math.abs(n));
const short=n=>{n=Math.abs(n);if(n>=1e6)return (Math.round(n/1e4)/100).toLocaleString("id-ID")+"jt";if(n>=1e3)return (Math.round(n/100)/10).toLocaleString("id-ID")+"rb";return String(Math.round(n))};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap=s=>s?s.charAt(0).toUpperCase()+s.slice(1):s;
const title=s=>String(s||"").toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const sameDay=(a,b)=>a&&b&&a.getFullYear()==b.getFullYear()&&a.getMonth()==b.getMonth()&&a.getDate()==b.getDate();
const toSheetDate=d=>String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear();
const toISO=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fromISO=v=>{const [y,m,d]=v.split("-").map(Number);return new Date(y,m-1,d)};
const daysIn=(y,m)=>new Date(y,m+1,0).getDate();
const isSaving=c=>/tabung/i.test(c||"");
const digits=v=>Number(String(v||"").replace(/\D/g,""))||0;
const money=el=>el&&el.addEventListener("input",()=>{const n=digits(el.value);el.value=n?n.toLocaleString("id-ID"):""});
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const monday=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const inMonth=(t,m)=>t.date.getFullYear()===m.getFullYear()&&t.date.getMonth()===m.getMonth();

let theme=ls.get("kh_theme")||"auto";
function applyTheme(){const r=document.documentElement;r.classList.toggle("t-light",theme==="light");r.classList.toggle("t-dark",theme==="dark");const dk=theme==="dark"||(theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);const m=document.getElementById("themeColor");if(m)m.content=dk?"#15110E":"#FBF8F4"}
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}applyTheme();

/* category look */
const LOOK=[[/makan|minum/i,"food","#F76B15"],[/transport/i,"car","#A18072"],[/belanja harian|kebutuhan/i,"cart","#3E63DD"],[/pribadi|fashion/i,"bag","#8E4EC6"],[/anak/i,"kid","#12A594"],[/sehat/i,"heart","#E5484D"],
  [/tagihan|utilitas|listrik/i,"bolt","#D99A00"],[/pulsa|internet/i,"wifi","#0090FF"],[/hiburan/i,"film","#D6409F"],[/pendidikan|sekolah/i,"book","#5B5BD6"],[/sedekah|donasi|zakat/i,"gift","#E54666"],[/tabung/i,"pig","#30A46C"],
  [/gaji/i,"wallet","#18794E"],[/bonus/i,"gift","#30A46C"],[/freelance|sampingan/i,"brief","#0D74CE"],[/usaha/i,"store","#AD5700"],[/hadiah/i,"gift","#D6409F"],[/investasi/i,"trend","#12A594"],[/belanja/i,"cart","#3E63DD"]];
function look(cat,type){if(type===XF)return ["swap","#2563EB"];if(type===UP)return ["users","#B7791F"];for(const [re,ic,c] of LOOK)if(re.test(cat||""))return [ic,c];return ["dots","#8B8D98"]}
const ico=(n,s)=>`<svg width="${s||20}" height="${s||20}"><use href="#c-${n}"/></svg>`;

/* state */
let mcp=null,sample=null,live=false;
const CFG_KEY="catat_cfg";
function getCfg(){try{return JSON.parse(ls.get(CFG_KEY)||"null")}catch(e){return null}}
async function api(cfg,tool,input){if(!navigator.onLine)throw {code:"offline"};let r;
  try{r=await fetch(cfg.url,{method:"POST",body:JSON.stringify({pin:cfg.pin,tool,...input}),redirect:"follow"})}catch(e){throw {code:"server_unavailable",retryable:true}}
  let j;try{j=await r.json()}catch(e){throw {code:"server_unavailable",message:"Balasan Apps Script tidak terbaca. Pastikan akses web app: Siapa saja."}}
  if(j&&j.error)throw {code:j.error==="unauthorized"||j.error==="pin_not_set"?j.error:"tool_error",message:j.message||j.error};return j}
function makeBackend(cfg){return {callTool:async(srv,tool,input)=>{const {spreadsheetId,...rest}=input||{};return {payload:await api(cfg,tool,rest)}}}}
const st={tx:[],out:[],inc:[],xfer:[],budget:{},accs:[],limit:0,debts:[],debtNext:2,view:"harian",sel:today(),wk:monday(today()),month:new Date(today().getFullYear(),today().getMonth(),1),
  f:null,menuTab:"akun",confirm:null,editRow:null,lastUndo:null};

function parseAmount(v){if(typeof v==="number")return v;const s=String(v??"").replace(/[^\d,-]/g,"").split(",")[0];return Number(s)||0}
function parseSigned(v){if(typeof v==="number")return v;const s=String(v??"");const n=parseAmount(s);return /^\s*[-−]/.test(s)||/-Rp/.test(s)?-Math.abs(n):n}
function parseDate(v){if(typeof v==="number"){const d=new Date(Date.UTC(1899,11,30)+v*864e5);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())}
  const m=String(v??"").match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);if(!m)return null;const y=+m[3]<100?2000+(+m[3]):+m[3];return new Date(y,+m[2]-1,+m[1])}
function payloadOf(r){let p=r&&r.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}return p||{}}
const accOf=n=>st.accs.find(a=>a.name===n);
const accType=n=>(accOf(n)||{}).type||"Rekening";
const firstOf=t=>(st.accs.find(a=>a.type===t)||{}).name||null;
function balances(){const b={};st.accs.forEach(a=>b[a.name]=a.init);
  st.tx.forEach(t=>{if(t.type==="Pemasukan"){if(t.acc in b)b[t.acc]+=t.amt}else if(t.type==="Pengeluaran"){if(t.acc in b)b[t.acc]-=t.amt}
    else if(t.type===XF){if(t.acc in b)b[t.acc]-=t.amt;if(t.to in b)b[t.to]+=t.amt}
    else if(t.type===UP&&t.acc in b){if(UP_IN.includes(t.cat))b[t.acc]+=t.amt;else if(UP_OUT.includes(t.cat))b[t.acc]-=t.amt}});return b}
const shownTotal=()=>{const b=balances();return st.accs.filter(a=>a.show).reduce((x,a)=>x+b[a.name],0)};

/* connector */
function errText(e,write){const c=e&&e.code;
  if(c==="unauthorized")return "PIN salah. Buka ☰ → Atur → Ganti sambungan.";
  if(c==="offline")return "Tidak ada internet. Coba lagi setelah tersambung.";
  if(c==="server_not_connected"||c==="selection_required")return "Google Sheets belum terhubung. Tambahkan di claude.ai → Pengaturan → Konektor, lalu muat ulang.";
  if(c==="needs_reauth")return "Sambungan Google Sheets kedaluwarsa. Hubungkan ulang di claude.ai → Pengaturan → Konektor.";
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required")return "Halaman ini belum diizinkan memakai Google Sheets. Muat ulang lalu pilih Izinkan.";
  if(c==="blocked_by_policy")return "Akses Google Sheets diblokir oleh kebijakan akun Anda.";
  if(write&&(c==="server_unavailable"||c==="upstream_error"||c==="cancelled"))return "Koneksi terputus saat menyimpan. Muat ulang dulu untuk cek, supaya tidak tercatat dua kali.";
  if(c==="server_unavailable")return "Google Sheets sedang tidak merespons. Coba lagi sebentar lagi.";
  if(c==="tool_error")return "Google Sheets menolak permintaan: "+(e.message||"");
  if(c==="not_connected")return "Belum tersambung ke Google Sheets.";
  return "Gagal terhubung ke Google Sheets"+(e&&e.message?": "+e.message:".")}
function setDot(k){$("dot").className="dot "+k}
function showBanner(msg){const b=$("banner");if(!msg){b.hidden=true;return}b.className="banner";b.innerHTML=`<span>${esc(msg)}</span><button type="button" id="bRetry">Muat ulang</button>`;b.hidden=false;$("bRetry").onclick=()=>load(true)}
async function getValues(range){const r=await mcp.callTool(SRV,"get_values",{spreadsheetId:SID,range},{cache:false});return payloadOf(r).values||[]}
async function call(tool,input){if(!mcp||!live)throw {code:"not_connected"};return payloadOf(await mcp.callTool(SRV,tool,{spreadsheetId:SID,...input}))}
async function load(retry){if(!mcp)return;setDot("busy");
  try{const res=payloadOf(await mcp.callTool(SRV,"batch_get",{ranges:["Transaksi!A2:G","Kategori!A2:F60","Akun!A2:E40","Pengaturan!B2","Utang!A2:G300"]})).valueRanges||[];const [rows,cats,acc,cfg,dbt]=[0,1,2,3,4].map(i=>(res[i]&&res[i].values)||[]);
    ingest(rows,cats,acc,cfg,dbt);live=true;showBanner(null);setDot("ok");renderAll()}
  catch(e){if(e&&e.retryable&&retry!==false){await new Promise(r=>setTimeout(r,(e.retryAfterMs||800)+Math.random()*600));return load(false)}
    setDot("err");if(e&&e.code==="unauthorized"){showSetup("PIN tidak cocok. Periksa lagi.");return}showBanner(errText(e,false));renderAll()}}
function ingest(rows,cats,acc,cfg,dbt){st.out=[];st.inc=[];st.xfer=[];st.budget={};
  cats.forEach(r=>{if(r[0]){st.out.push(r[0]);const b=parseAmount(r[1]);if(b>0)st.budget[r[0]]=b}if(r[3])st.inc.push(r[3]);if(r[5])st.xfer.push(r[5])});
  if(!st.xfer.length)st.xfer=["Tarik Tunai","Setor Tunai","Top Up E-Wallet","Pindah Antar Akun"];
  st.accs=acc.map((r,i)=>({row:i+2,name:String(r[0]||"").trim(),type:["Rekening","Dompet","E-Wallet"].includes(r[1])?r[1]:"Rekening",init:parseSigned(r[2]),show:String(r[4]||"").trim().toLowerCase()!=="tidak"})).filter(a=>a.name);
  st.tx=rows.map((r,i)=>({row:i+2,date:parseDate(r[0]),type:r[1],cat:r[2]||"Tanpa kategori",note:r[3]||"",amt:parseAmount(r[4]),acc:r[5]||"",to:r[6]||""})).filter(t=>t.date&&t.amt>0&&["Pemasukan","Pengeluaran",XF,UP].includes(t.type));
  st.limit=parseAmount(cfg[0]&&cfg[0][0]);
  st.debtNext=dbt.length+2;st.debts=dbt.map((r,i)=>({row:i+2,id:String(r[0]||"").trim(),date:parseDate(r[1])||today(),kind:r[2]==="Utang"?"Utang":"Piutang",name:r[3]||"",amt:parseAmount(r[4]),due:parseDate(r[5]),note:r[6]||""})).filter(d=>d.id&&d.name&&d.amt>0)}
function defaultAcc(type){const k=type==="Pemasukan"?"kh_acc_in":type===XF?"kh_acc_x":"kh_acc_out",v=ls.get(k);if(v&&accOf(v))return v;
  return type==="Pengeluaran"?(firstOf("Dompet")||(st.accs[0]||{}).name):(firstOf("Rekening")||(st.accs[0]||{}).name)||null}

function findAccounts(s){const hits=[];
  st.accs.forEach(a=>{const m=s.toLowerCase().indexOf(a.name.toLowerCase());if(m>=0&&reWord(a.name).test(s))hits.push({name:a.name,pos:m,word:a.name,exact:true})});
  for(const [type,words] of Object.entries(ALIAS)){for(const w of words){const mm=s.match(reWord(w));if(mm){const byName=st.accs.find(a=>a.name.toLowerCase().includes(w));const name=byName?byName.name:firstOf(type);
    if(name&&!hits.some(h=>h.name===name))hits.push({name,pos:mm.index,word:w})}}}
  return hits.sort((a,b)=>(b.exact?1:0)-(a.exact?1:0)||a.pos-b.pos)}
function findAmount(s){const re=/(\d+(?:[.,]\d+)*)\s*(rb|ribu|k|jt|juta)?(?![a-z0-9])/gi;let m,best=null;

    if(suf==="rb"||suf==="ribu"||suf==="k")n=dec*1e3;else if(suf==="jt"||suf==="juta")n=dec*1e6;else n=Number(raw.replace(/[.,]/g,""));
    const c={n:Math.round(n),str:m[0],suf:!!suf};if(c.n<100&&!suf)continue;if(!best||(c.suf&&!best.suf)||(c.suf===best.suf&&c.n>best.n))best=c}
  return best}
function guessCat(note,type){const lc=" "+String(note||"").toLowerCase()+" ",all=type==="Pemasukan"?st.inc:type==="Pengeluaran"?st.out:[...st.out,...st.inc];

function parseQuick(text){let s=" "+text.trim()+" ";const res={type:null,amount:0,cat:null,acc:null,to:null,date:today(),note:""};

      const hits=findAccounts(s.replace(rx," "));res.acc=from?firstOf(from):null;res.to=to?firstOf(to):null;
      if(key==="top up"){const ew=hits.find(h=>accType(h.name)==="E-Wallet");if(ew)res.to=ew.name;const src=hits.find(h=>h.name!==res.to&&accType(h.name)!=="E-Wallet");if(src)res.acc=src.name}

      if(res.acc===res.to)res.to=null;let rest=s.replace(rx," ");hits.forEach(h=>{rest=rest.replace(reWord(h.word),"$1 ")});
      rest=rest.replace(/\b(dari|ke|di|via|lewat|pakai|pake)\b/ig," ").replace(/\s+/g," ").replace(/^[\s,.]+|[\s,.]+$/g,"").trim();res.note=cap(rest);if(sameDay(res.date,today()))res.date=selDay();return res}}
  const hits=findAccounts(s);if(hits.length){res.acc=hits[0].name;s=s.replace(reWord(hits[0].word),"$1 ")}
  let note=s.replace(/\s+/g," ").replace(/^[\s+\-,.]+|[\s,.]+$/g,"").replace(/\s(ke|dari|pakai|pake|via|lewat)$/i,"").trim();

function cleanName(s){s=" "+s+" ";findAccounts(s).forEach(h=>{s=s.replace(reWord(h.word),"$1 ")});

function parseDebt(text){const a=findAmount(" "+text+" ");let s=(a?(" "+text+" ").replace(a.str," "):text).replace(/\s+/g," ").trim();const amt=a?a.n:0;let m;

function parseSplit(text){const m=text.match(/\bpatungan\b\s*(?:dengan|sama|bareng|ama)?\s*(.*)$/i);

    return {mode:"me",base:base.trim()||text,names:names.split(/,|;|&|\s+dan\s+|\s+sama\s+/i).map(cleanName).filter(Boolean)}}

  if(d){const n={berdua:2,bertiga:3,berempat:4,berlima:5}[((text.match(/\b(berdua|bertiga|berempat|berlima)\b/i)||[])[1]||"").toLowerCase()]||2;

function normAmt(raw){let s=String(raw).trim().replace(/[.,]$/,"");if(/[.,]\d{2}$/.test(s))s=s.slice(0,-3);return Number(s.replace(/[.,\s]/g,""))||0}
function exactAcc(s,type){const hits=st.accs.filter(a=>reWord(a.name).test(s)&&(!type||a.type===type));return hits.length?hits.sort((a,b)=>b.name.length-a.name.length)[0].name:null}
const looksNotif=t=>t.length>=24&&/(rp\.?|idr)\s*\d/i.test(t)&&/(qris|transfer|pembayaran|berhasil|rekening|debit|kredit|transaksi|tarik tunai|top ?up|diterima|saldo|sebesar)/i.test(t);
function parseNotif(text){const s=String(text||"").replace(/\s+/g," ").trim();if(!s)return null;let amount=0;const re=/(?:rp\.?|idr)\s*([\d][\d.,]*)/gi;let m;

  const res={amount,type:"Pengeluaran",cat:null,acc:null,to:null,date:today(),note:""};

  else if(/top ?up/i.test(s)&&/(gopay|ovo|dana|shopeepay|linkaja|e-?wallet)/i.test(s)){res.type=XF;res.cat=st.xfer.find(x=>/top/i.test(x))||st.xfer[0];const h=findAccounts(s);res.to=exactAcc(s,"E-Wallet")||(h.find(x=>accType(x.name)==="E-Wallet")||{}).name||firstOf("E-Wallet");res.acc=exactAcc(s,"Rekening")||firstOf("Rekening")}

const newId=()=>Date.now().toString(36).slice(-5)+Math.random().toString(36).slice(2,4);
function debtPaid(d){const p="utang#"+d.id.toLowerCase()+" ";return st.tx.filter(t=>t.type===UP&&UP_PAY.includes(t.cat)&&t.note.toLowerCase().startsWith(p)).reduce((a,t)=>a+t.amt,0)}
function debtLeft(d){return Math.max(0,d.amt-debtPaid(d))}
async function writeDebts(list){const r=st.debtNext,end=r+list.length-1;
  await call("update_values",{range:`Utang!A${r}:G${end}`,values:list.map(d=>[d.id,toSheetDate(d.date),d.kind,d.name,d.amt,d.due?toSheetDate(d.due):"",d.note||""])});
  list.forEach((d,i)=>st.debts.push({...d,row:r+i}));st.debtNext=end+1;return `Utang!A${r}:G${end}`}

async function saveTx(recs,debts,msg){if(!mcp||!live){toast("Belum tersambung ke Google Sheets.");return false}

    const p=await call("append_values",{range:"Transaksi!A1:G1",values:recs.map(r=>[toSheetDate(r.date),r.type,r.cat,r.note||"",r.amt,r.acc||"",r.to||""])});
    const rng=p.updates&&p.updates.updatedRange,ok=typeof rng==="string"&&/^'?Transaksi'?!A\d+:G\d+$/.test(rng),start=ok?+rng.match(/A(\d+)/)[1]:null;
    const rows=recs.map((r,i)=>({...r,row:start?start+i:1e9+Math.random()}));rows.forEach(r=>st.tx.push(r));
    const r0=recs[0];ls.set(r0.type==="Pemasukan"?"kh_acc_in":r0.type===XF?"kh_acc_x":"kh_acc_out",r0.acc);setDot("ok");

async function submitQuick(){const v=q.value.trim();if(!v)return;const clear=()=>{q.value="";quickPreview();q.blur()};
  if(looksNotif(v)){clear();return handleNotif(v)}

    const typ=r.jenis==="masuk"?"Pemasukan":r.jenis==="tarik_tunai"?XF:"Pengeluaran",base=parseNotif(text)||{};

async function handleSplit(sp){const p=parseQuick(sp.base);p.type="Pengeluaran";if(!p.cat)p.cat=guessCat(p.note,"Pengeluaran")||st.out.find(c=>/makan/i.test(c))||st.out[0];

async function handleDebt(d){const acc=(findAccounts(d.raw||"")[0]||{}).name;

  const list=openDebtsOf(d.name,d.kind).sort((a,b)=>a.date-b.date);if(!list.length){toast(`Tidak ada ${d.kind==="Piutang"?"piutang":"utang"} atas nama ${d.name}`);return false}

    f.setAttribute("aria-busy","true");try{const fg=await getValues("Transaksi!F2:G"),ru=await getValues("Rutin!E2:E100").catch(()=>[]);const map=v=>(String(v||"")===old?nw:(v==null?"":v));
      if(fg.length)await call("update_values",{range:`Transaksi!F2:G${fg.length+1}`,values:fg.map(r=>[map(r[0]),map(r[1])])});
      if(ru.length)await call("update_values",{range:`Rutin!E2:E${ru.length+1}`,values:ru.map(r=>[map(r[0])])});
      await call("update_values",{range:`Akun!A${a.row}`,values:[[nw]]});["kh_acc_in","kh_acc_out","kh_acc_x"].forEach(k=>{if(ls.get(k)===old)ls.set(k,nw)});st.confirm=null;toast(`${old} → ${nw}`);await load(true)}
    catch(err){toast(errText(err,true));f.removeAttribute("aria-busy")}return}
  if(f.id==="accForm"){const name=$("aName").value.trim(),type=$("aType").value,bal=digits($("aBal").value);if(!name){$("aName").focus();return}if(accOf(name)){toast("Nama akun itu sudah ada.");return}
    const used=new Set(st.accs.map(a=>a.row));let row=2;while(used.has(row))row++;if(await patch(`Akun!A${row}:C${row}`,[[name,type,bal]],f)){toast("Akun "+name+" ditambahkan");await load(true)}}});

/* receipt */
$("cam").onclick=()=>{if(!sample){toast("Foto struk butuh izin memakai Claude.");return}$("file").click()};
$("file").onchange=async e=>{const f=e.target.files&&e.target.files[0];e.target.value="";if(!f||!sample)return;toast("Membaca struk…");
  try{const r=await sample.json(`Ini foto struk atau nota belanja di Indonesia. Balas HANYA satu objek JSON: {"total": total dibayar dalam rupiah tanpa titik (0 jika tidak terbaca), "toko": nama toko atau null, "tanggal": "dd/mm/yyyy" atau null, "kategori": salah satu dari ${JSON.stringify(st.out)} atau null, "bayar": "tunai"|"qris"|"debit"|"kredit"|"ewallet"|null, "ringkas": isi belanja utama maksimal 4 kata}`,{images:[f]});
    const total=Math.round(Number(r&&r.total)||0);if(!total){toast("Total di struk tidak terbaca. Coba foto lebih dekat.");return}
    const pay=String(r.bayar||"").toLowerCase(),acc=pay==="tunai"?firstOf("Dompet"):pay==="ewallet"?firstOf("E-Wallet"):pay?firstOf("Rekening"):null,d=parseDate(r.tanggal);
    openCatat({type:"Pengeluaran",amount:total,cat:st.out.includes(r.kategori)?r.kategori:null,acc,date:d&&Math.abs(d-today())<60*864e5&&d<=today()?d:today(),note:[r.toko,r.ringkas].filter(Boolean).join(" · ").slice(0,120),msg:"Dari struk. Cek lalu Simpan"})}
  catch(err){const c=err&&err.code;toast(c==="not_granted"||c==="sampling_disabled"?"Foto struk butuh izin memakai Claude. Muat ulang lalu Izinkan.":"Struk tidak terbaca jelas. Coba foto ulang.")}};

/* boot */
renderAll();
$("cam").hidden=true;
function showSetup(msg){const c=getCfg()||{};$("sUrl").value=c.url||"";$("sPin").value=c.pin||"";$("sErr").hidden=!msg;$("sErr").textContent=msg||"";$("setup").hidden=false}
$("setupForm").addEventListener("submit",async e=>{e.preventDefault();const url=$("sUrl").value.trim(),pin=$("sPin").value.trim(),err=$("sErr"),go=$("sGo");
  if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url)){err.hidden=false;err.textContent="URL harus diawali https://script.google.com/macros/s/…";return}
  if(!pin){err.hidden=false;err.textContent="Isi PIN-nya";return}
  go.setAttribute("aria-busy","true");go.textContent="Menyambungkan…";
  try{await api({url,pin},"ping",{});ls.set(CFG_KEY,JSON.stringify({url,pin}));$("setup").hidden=true;mcp=makeBackend({url,pin});load(true)}
  catch(x){err.hidden=false;err.textContent=x.code==="pin_not_set"?"PIN di Apps Script masih GANTI-PIN-INI. Ganti PIN-nya, Simpan, lalu Kelola deployment → Versi baru → Terapkan.":x.code==="unauthorized"?"PIN tidak cocok. Pastikan sudah Kelola deployment → Versi baru setelah mengganti PIN.":errText(x,false)}
  finally{go.removeAttribute("aria-busy");go.textContent="Sambungkan"}});
(()=>{const c=getCfg();if(!c||!c.url){setDot("err");$("tl").innerHTML="";showSetup();return}mcp=makeBackend(c);load(true)})();
window.addEventListener("online",()=>{if(mcp&&!live)load(true)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&mcp&&live&&!st.sheetKind)load(true)});
})();
</script>
</body>
